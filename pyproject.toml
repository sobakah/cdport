[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cdport"
dynamic = ["version"]
description = "Interactive CLI that rips an audio CD with cyanrip, hands it to a tag editor and embeds lyrics with lyrembed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# mutagen: the tag check after editing; without it that check is skipped.
# jeepney: the D-Bus interface (--dbus); without it only that is missing.
dependencies = ["mutagen>=1.45", "jeepney>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
cdport = "cdport.cli:main"
cdport-cover = "cdport.covertool:main"
# The old names, kept as aliases: other programs may still start cdimport.
cdimport = "cdport.cli:main"
cdimport-cover = "cdport.covertool:main"

[tool.setuptools]
packages = ["cdport"]

[tool.setuptools.package-data]
cdport = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg", "static/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "cdport.config.__version__" }
