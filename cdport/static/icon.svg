<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="0.5" stop-color="#dc8add"/>
      <stop offset="1" stop-color="#f9f06b"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa348"/>
      <stop offset="1" stop-color="#e66100"/>
    </linearGradient>
    <!-- what is left of the disc: its lower right crumbles away in steps -->
    <clipPath id="rest">
      <path d="M0 0 H128 V24 H76 V32 H68 V40 H60 V48 H52 V56 H44 V64 H36 V72 H28 V128 H0 Z"/>
    </clipPath>
  </defs>
  <!-- the disc -->
  <g clip-path="url(#rest)">
    <circle cx="44" cy="46" r="35" fill="#1c71d8" opacity="0.35"/>
    <circle cx="42" cy="42" r="35" fill="url(#disc)"/>
    <path d="M42 42 L42 7 A35 35 0 0 1 77 42 Z" fill="url(#sheen)" opacity="0.6"/>
    <path d="M42 42 L42 77 A35 35 0 0 1 7 42 Z" fill="url(#sheen)" opacity="0.6"/>
    <circle cx="42" cy="42" r="34" fill="none" stroke="#c0bfbc" stroke-width="2"/>
    <circle cx="42" cy="42" r="12" fill="#f6f5f4" stroke="#c0bfbc" stroke-width="2"/>
    <circle cx="42" cy="42" r="5" fill="#77767b"/>
  </g>
  <!-- its bits, on their way into the file -->
  <rect x="69" y="33" width="7" height="7" rx="1.5" fill="#dc8add"/>
  <rect x="61" y="41" width="7" height="7" rx="1.5" fill="#f6f5f4" stroke="#c0bfbc" stroke-width="1.5"/>
  <rect x="53" y="57" width="7" height="7" rx="1.5" fill="#f9f06b"/>
  <rect x="45" y="65" width="7" height="7" rx="1.5" fill="#99c1f1"/>
  <rect x="64" y="51" width="6" height="6" rx="1.5" fill="#99c1f1"/>
  <rect x="37" y="77" width="6" height="6" rx="1.5" fill="#dc8add"/>
  <rect x="53" y="74" width="5" height="5" rx="1.5" fill="#deddda"/>
  <rect x="78" y="40" width="5" height="5" rx="1.5" fill="#f9f06b"/>
  <!-- the file they become -->
  <g transform="translate(66 50) rotate(8) scale(0.86)">
    <path d="M4 6 H40 L60 26 V74 Q60 80 54 80 H10 Q4 80 4 74 Z" fill="#1c71d8" opacity="0.35"/>
    <path d="M0 6 Q0 0 6 0 H38 L58 20 V68 Q58 74 52 74 H6 Q0 74 0 68 Z" fill="#ffffff"/>
    <path d="M38 0 V14 Q38 20 44 20 H58 Z" fill="#c0bfbc"/>
    <g fill="url(#note)">
      <path d="M22 30 L44 25 V31 L22 36 Z"/>
      <rect x="22" y="31" width="5" height="25"/>
      <rect x="39" y="27" width="5" height="25"/>
      <ellipse cx="18.5" cy="56" rx="7.5" ry="6" transform="rotate(-20 18.5 56)"/>
      <ellipse cx="35.5" cy="52" rx="7.5" ry="6" transform="rotate(-20 35.5 52)"/>
    </g>
  </g>
  <!-- sparkles -->
  <path d="M106 12 Q107.8 21.2 117 23 Q107.8 24.8 106 34 Q104.2 24.8 95 23 Q104.2 21.2 106 12 Z" fill="#f6d32d"/>
  <path d="M20 94 Q21.2 100.8 28 102 Q21.2 103.2 20 110 Q18.8 103.2 12 102 Q18.8 100.8 20 94 Z" fill="#f6d32d"/>
</svg>
